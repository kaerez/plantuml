name: Deploy TeaVM JavaScript to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Clone PlantUML and build TeaVM artifacts
        run: |
          git clone https://github.com/plantuml/plantuml.git plantuml
          cd plantuml
          chmod +x ./gradlew
          ./gradlew clean teavm -Pfast

      - name: Copy TeaVM JavaScript artifacts
        run: |
          mkdir -p build/site
          cp plantuml/build/generated/teavm/js/plantuml.js build/site/plantuml.js
          cp plantuml/build/generated/teavm/js/viz-global.js build/site/viz-global.js

      - name: Deploy Site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
