name: Deploy GitHub Pages

on:
  # Manual trigger
  workflow_dispatch:
  # Trigger from CI workflow on release/snapshot
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy-pages:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Generate artifacts
        run: |
          gradle patchCompilationInfo
          gradle clean build teavmZip \
            generateMetadataFileForMavenPublication generatePomFileForMavenPublication \
            -x test

      - name: Download js-plantuml ZIP
        run: |
          mkdir -p build/libs
          # If building locally, the ZIP was just created above
          # This is a fallback in case we need to restore from CI
          ls -la build/libs/js-plantuml-*.zip || echo "ZIP will be created above"

      - name: Extract JS files into build/generated/teavm/js
        run: |
          mkdir -p build/generated/teavm/js
          unzip -o build/libs/js-plantuml-*.zip -d build/generated/teavm/js
          echo "::group::[List build/generated/teavm/js]"
          ls -la build/generated/teavm/js/
          echo "::endgroup::"

      - name: Build Site for GH Page
        run: gradle siteAssemble

      - name: Deploy Site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
          cname: # Leave empty unless you have a custom domain

      - name: Page deployment summary
        run: |
          echo "## GitHub Pages Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Site published to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
